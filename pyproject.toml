[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "surrogate-modelling-service"
version = "0.1.0"
description = "A minimal FastAPI service with xarray and console logging"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2.1,<3",
    "python-multipart>=0.0.20,<1",
    "torch>=2.6,<3",
    "xarray>=2025.1,<2027",
    "uvicorn>=0.34,<1",
    "wandb>=0.19.10,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
