[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "surrogate-modelling-service"
version = "0.1.0"
description = "A minimal FastAPI service with xarray and console logging"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "xarray>=2025.1,<2027",
    "uvicorn>=0.34,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
